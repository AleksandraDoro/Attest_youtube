<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список сообщений</title>
    <meta charset="UTF-8">
</head>
<body>
<div>
    <form method="post" action="/"> <!-- Убедитесь, что action указан правильно -->
        <input type="text" name="text" placeholder="Введите сообщение" required>
        <input type="text" name="tag" placeholder="Тег" required>
        <button type="submit">Добавить</button>
    </form>
</div>
<div>Список сообщений:</div>
 <form method="post" action="filter">
     <input type="text" name="filter">
     <button type="submit">Найти</button>
 </form>
<div th:each="message : ${messages}">
    <div>
        <b th:text="${message.id}"></b>
        <span th:text="${message.text}"></span>
        <i th:text="${message.tag}"></i>
    </div>
</div>
</body>
</html>
